# Evolve loop (ADR-0027): the agent improves its own rules from its quality metrics. Two jobs, so the agent never holds
# a write token and nothing it does to the runner can change how its proposals are checked:
#   propose (read-only token): signals → /evolve --headless commits one rule + one seeded case per evolve/* branch →
#            the branches leave as a git bundle and the PR texts as an artifact (data only)
#   ship    (write token): fresh checkout of the main SHA the signals were computed on → validate the manifest against the
#            signals saved before the agent ran → check-paths (ADR D2) + eval gate (ADR D3) with no GitHub token in the env →
#            a pass becomes a PR labelled `evolve` for the owner to merge, a fail becomes an `evolve` issue. Nothing is merged.
name: Agent Evolve

on:
  schedule:
    - cron: "0 2 * * 1"  # Monday 09:00 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      since:
        description: Metrics start date (YYYY-MM-DD); default 30 days ago
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: agent-evolve
  cancel-in-progress: false

jobs:
  propose:
    if: github.event_name == 'schedule' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      main_sha: ${{ steps.base.outputs.sha }}
      count: ${{ steps.signals.outputs.count }}
      agent: ${{ steps.claude.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Signals
        id: signals
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        run: |
          node scripts/evolve.mjs signals ${SINCE:+--since "$SINCE"} --out "$RUNNER_TEMP/signals.json"
          cat "$RUNNER_TEMP/signals.json"
          echo "count=$(node -e 'console.log(require(process.argv[1]).signals.length)' "$RUNNER_TEMP/signals.json")" >> "$GITHUB_OUTPUT"
          mkdir -p evolve-out
          cp "$RUNNER_TEMP/signals.json" evolve-out/signals.json
      - name: Save the signals before the agent runs (the ship job trusts only this copy)
        if: steps.signals.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: evolve-signals
          path: ${{ runner.temp }}/signals.json
          retention-days: 7
      - name: Git identity
        if: steps.signals.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: claude
        if: steps.signals.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          display_report: "false"
          settings: '{"env":{"CLAUDE_CODE_DISABLE_BACKGROUND_TASKS":"1"}}'
          prompt: /evolve --headless --signals evolve-out/signals.json
          claude_args: >-
            --max-turns 150
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,TodoWrite,Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git diff:*),Bash(git show:*),Bash(git log:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git ls-files:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(mkdir:*)"
            --disallowedTools "Bash(git push:*),Bash(git config:*),Bash(git update-ref:*),Bash(git -c:*),Bash(git -C:*),Bash(gh:*),Bash(node:*),Bash(cat:*)"
      - name: Package the proposals as data
        if: always() && steps.signals.outputs.count != '0'
        run: |
          p="$RUNNER_TEMP/proposal"; mkdir -p "$p/evolve-out"
          g() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          refs=$(g for-each-ref --format='%(refname)' 'refs/heads/evolve/')
          if [ -n "$refs" ]; then
            # shellcheck disable=SC2086
            g bundle create "$p/evolve.bundle" "^$MAIN" $refs
          fi
          find evolve-out -maxdepth 1 -type f \( -name '*.md' -o -name manifest.json \) -size -64k -exec cp {} "$p/evolve-out/" \;
          ls -la "$p" "$p/evolve-out"
        env:
          MAIN: ${{ steps.base.outputs.sha }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.signals.outputs.count != '0'
        with:
          name: evolve-proposal
          path: ${{ runner.temp }}/proposal
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the Claude transcript for diagnosis
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: evolve-transcript-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14

  ship:
    needs: propose
    if: always() && needs.propose.result != 'skipped' && needs.propose.outputs.count != '' && needs.propose.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      MAIN: ${{ needs.propose.outputs.main_sha }}
      T: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.propose.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: evolve-signals
          path: ${{ runner.temp }}/trusted
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: evolve-proposal
          path: ${{ runner.temp }}/proposal
      - name: Read the proposals
        run: |
          mkdir -p "$T/ship"
          if [ -f "$T/proposal/evolve.bundle" ]; then
            git bundle verify "$T/proposal/evolve.bundle"
            git fetch --no-tags "$T/proposal/evolve.bundle" 'refs/heads/evolve/*:refs/heads/evolve/*'
          fi
          node scripts/evolve.mjs manifest --signals "$T/trusted/signals.json" --manifest "$T/proposal/evolve-out/manifest.json" \
            --rows "$T/ship/rows.tsv" --unhandled "$T/ship/unhandled.txt"
          cat "$T/ship/rows.tsv"
      - name: Install the claude CLI for the eval gate
        run: npm install -g @anthropic-ai/claude-code@2.1.304
      - name: Check paths and run the eval gate (no GitHub token here)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -u
          while IFS=$'\t' read -r signal branch case kind body || [ -n "$signal" ]; do
            slug=${branch#evolve/}; r="$T/ship/$slug"
            if ! git rev-parse --verify --quiet "refs/heads/$branch" >/dev/null; then
              echo no-branch > "$r.status"; continue
            fi
            if ! node scripts/evolve.mjs check-paths --base "$MAIN" --head "$branch" --kind "$kind" > "$r.paths" 2>&1; then
              echo fail-paths > "$r.status"; continue
            fi
            if [ "$kind" = "not-eval-proven" ]; then
              echo "**Not eval-proven:** this rule is for a stage the seeded evals cannot test (ADR-0027 Consequences)." > "$r.gate.md"
              echo pass-draft > "$r.status"
            elif [ "$kind" = "compress" ]; then
              # D6: always a draft PR, the owner reads every removed line
              if node scripts/evolve.mjs gate --base "$MAIN" --head "$branch" --kind compress --out "$r.gate.md" 2> "$r.log"; then
                echo pass-draft > "$r.status"
              else
                [ -s "$r.gate.md" ] || { echo "The compress gate did not complete:"; echo; sed 's/^/    /' "$r.log"; } > "$r.gate.md"
                echo fail-gate > "$r.status"
              fi
            elif node scripts/evolve.mjs gate --base "$MAIN" --head "$branch" --case "$case" --kind "$kind" --out "$r.gate.md" 2> "$r.log"; then
              echo pass > "$r.status"
            else
              [ -s "$r.gate.md" ] || { echo "The eval gate did not complete:"; echo; sed 's/^/    /' "$r.log"; } > "$r.gate.md"
              echo fail-gate > "$r.status"
            fi
          done < "$T/ship/rows.tsv"
      - name: Publish PRs and issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT: ${{ needs.propose.outputs.agent }}
        run: |
          set -u
          rc=0
          gh label create evolve --color 5319e7 --description "Agent self-improvement (ADR-0027)" --force || rc=1
          text() {  # agent-written PR text: regular file, at most 64 KiB, dedupe markers removed
            f="$T/proposal/$1"
            if [ -f "$f" ] && [ ! -L "$f" ] && [ "$(wc -c < "$f")" -le 65536 ]; then sed '/<!-- evolve:signal=/d' "$f"; fi
          }
          issue() {  # signal, title, body file
            { printf '<!-- evolve:signal=%s -->\n\n' "$1"; cat "$3"; printf '\n\nRun: %s\n' "$RUN_URL"; } > "$T/ship/issue.md"
            gh issue create --label evolve --title "$2" --body-file "$T/ship/issue.md" || rc=1
          }
          while IFS=$'\t' read -r signal branch case kind body || [ -n "$signal" ]; do
            slug=${branch#evolve/}; r="$T/ship/$slug"
            case "$(cat "$r.status" 2>/dev/null)" in
              no-branch)
                printf 'The manifest names `%s`, but the agent did not create it.\n' "$branch" > "$r.why"
                issue "$signal" "Evolve: no branch for $signal" "$r.why" ;;
              fail-paths)
                { echo "The proposal on \`$branch\` breaks the Evolve allowlist (ADR-0027 D2):"; echo; sed 's/^/    /' "$r.paths"; } > "$r.why"
                issue "$signal" "Evolve: rejected proposal for $signal (paths)" "$r.why" ;;
              fail-gate)
                issue "$signal" "Evolve: proposal for $signal failed the eval gate" "$r.gate.md" ;;
              pass|pass-draft)
                draft=""; [ "$(cat "$r.status")" = "pass-draft" ] && draft="--draft"
                { printf '<!-- evolve:signal=%s -->\n\n' "$signal"; text "$body"; printf '\n\n'; cat "$r.gate.md"
                  printf '\n\nRun: %s\nMerge to adopt the rule; close to reject it (the signal is not proposed again).\n' "$RUN_URL"; } > "$r.pr.md"
                if git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "refs/heads/$branch:refs/heads/$branch"; then
                  # shellcheck disable=SC2086
                  gh pr create $draft --base main --head "$branch" --label evolve --title "Evolve: $signal" --body-file "$r.pr.md" || rc=1
                else
                  rc=1
                fi ;;
              *) echo "no gate result for $branch"; rc=1 ;;
            esac
          done < "$T/ship/rows.tsv"
          # A signal without a proposal is closed only when the agent finished; a crash or turn limit retries next week
          if [ "$AGENT" = "success" ]; then
            while read -r signal || [ -n "$signal" ]; do
              [ -n "$signal" ] || continue
              echo "The agent made no proposal for this signal (see the run transcript). It is not proposed again." > "$T/ship/none.md"
              issue "$signal" "Evolve: no proposal for $signal" "$T/ship/none.md"
            done < "$T/ship/unhandled.txt"
          else
            echo "agent step outcome: $AGENT; unhandled signals are left for the next run"
          fi
          exit $rc
