; Drop-in for nginx.service — install at /etc/systemd/system/nginx.service.d/override.conf
;
; Restart=always lets nginx self-heal from a single crash without any alert.
; OnFailure only fires once systemd gives up restarting within the burst
; window below, i.e. a real crash loop rather than a one-off blip.
[Unit]
OnFailure=nginx-alert.service
StartLimitIntervalSec=60
StartLimitBurst=3

[Service]
Restart=always
RestartSec=2
