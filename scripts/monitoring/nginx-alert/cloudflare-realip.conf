# Install at /etc/nginx/conf.d/cloudflare-realip.conf
#
# Origin sits behind Cloudflare, but without this, nginx logs Cloudflare's
# edge IP as $remote_addr for every request — so fail2ban's nginx-exploit-probe
# jail bans Cloudflare's own infrastructure instead of the real attacker,
# which then makes the origin refuse ALL Cloudflare traffic (Cloudflare
# error 521) once enough edge ranges get banned.
#
# This tells nginx to trust the CF-Connecting-IP header (set by Cloudflare,
# not spoofable by external clients since Cloudflare overwrites it at the
# edge) for the real client IP, but ONLY when the TCP connection itself
# comes from a known Cloudflare range.
#
# IP ranges: https://www.cloudflare.com/ips/ (updated occasionally — re-run
# run-all.sh after refreshing this file if Cloudflare changes their ranges)

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/29;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
